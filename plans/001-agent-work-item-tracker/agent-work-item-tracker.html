<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal agent work item tracker prototype">
  <title>Agent Work Item Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23162e51'/%3E%3Cpath d='M18 20h28v24H18z' fill='none' stroke='%2300bde3' stroke-width='4'/%3E%3Cpath d='M24 28h16M24 36h10' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #005ea2;
      --color-primary-dark: #1a4480;
      --color-primary-darker: #162e51;
      --color-primary-light: #73b3e7;
      --color-primary-lighter: #d9e8f6;
      --color-accent-cool: #00bde3;
      --color-accent-cool-darker: #07648d;
      --color-accent-cool-lighter: #e1f3f8;
      --color-accent-warm: #fa9441;
      --color-base-darkest: #1b1b1b;
      --color-base-darker: #3d4551;
      --color-base-dark: #565c65;
      --color-base: #71767a;
      --color-base-light: #a9aeb1;
      --color-base-lighter: #dfe1e2;
      --color-base-lightest: #f0f0f0;
      --color-white: #ffffff;
      --color-success: #00a91c;
      --color-success-lighter: #ecf3ec;
      --color-warning: #ffbe2e;
      --color-warning-lighter: #faf3d1;
      --color-error: #d83933;
      --color-error-lighter: #f4e3db;
      --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'Roboto Mono', 'SFMono-Regular', Consolas, monospace;
      --font-size-2xs: .88rem;
      --font-size-xs: .94rem;
      --font-size-sm: 1rem;
      --font-size-md: 1.06rem;
      --font-size-lg: 1.38rem;
      --font-size-xl: 2rem;
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 2.5rem;
      --border-radius: 6px;
      --shadow-soft: 0 2px 8px rgba(22, 46, 81, .08);
      --tracker-shell: #f7f9fb;
      --tracker-column: #eef2f6;
      --tracker-card: #ffffff;
      --tracker-line: #c9d3df;
      --tracker-muted: #637083;
      --tracker-purple: #7c3aed;
      --tracker-blue: #146ef5;
      --tracker-orange: #d85b00;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--color-base-darkest); background: var(--tracker-shell); font-family: var(--font-sans); font-size: var(--font-size-sm); line-height: 1.45; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--color-accent-cool); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .app-shell { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--color-primary-darker); border-bottom: 4px solid var(--color-accent-cool); color: var(--color-white); }
    .topbar-inner { max-width: 1600px; margin: 0 auto; padding: var(--space-3) var(--space-5); display: flex; align-items: center; gap: var(--space-5); }
    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: 230px; }
    .brand-mark { width: 32px; height: 32px; border: 2px solid var(--color-accent-cool); border-radius: var(--border-radius); display: grid; place-items: center; color: var(--color-accent-cool); font-weight: 800; font-size: var(--font-size-md); }
    .brand-name { font-size: var(--font-size-md); font-weight: 800; letter-spacing: -.01em; }
    .brand-subtitle { color: #c7d5e6; font-size: var(--font-size-2xs); margin-top: 1px; }
    .topbar-spacer { flex: 1; }
    .connection { display: flex; align-items: center; gap: var(--space-2); color: #e7f7eb; font-size: var(--font-size-xs); white-space: nowrap; }
    .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-success); box-shadow: 0 0 0 4px rgba(0, 169, 28, .18); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--color-accent-cool); color: var(--color-primary-darker); font-weight: 800; }
    .page { max-width: 1600px; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-7); }
    .page-heading { display: flex; align-items: flex-start; gap: var(--space-5); margin-bottom: var(--space-5); }
    .heading-copy { flex: 1; }
    h1 { margin: 0; color: var(--color-primary-darker); font-size: clamp(1.6rem, 3vw, 2.35rem); line-height: 1.15; letter-spacing: -.03em; }
    .lede { margin: var(--space-2) 0 0; color: var(--tracker-muted); font-size: var(--font-size-md); max-width: 720px; }
    .heading-actions { display: flex; align-items: center; gap: var(--space-3); }
    .btn { border: 2px solid transparent; border-radius: var(--border-radius); padding: .65rem 1rem; font-weight: 750; font-size: var(--font-size-xs); display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--color-primary); color: var(--color-white); border-color: var(--color-primary); }
    .btn-primary:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
    .btn-secondary { background: var(--color-white); color: var(--color-primary); border-color: var(--color-primary); }
    .btn-secondary:hover { background: var(--color-primary-lighter); }
    .btn-quiet { background: transparent; color: var(--tracker-muted); border-color: transparent; padding: .45rem .6rem; }
    .btn-quiet:hover { color: var(--color-primary); background: var(--color-primary-lighter); }
    .icon { width: 1.1em; height: 1.1em; display: inline-grid; place-items: center; font-size: 1.2em; line-height: 1; }
    .workspace-bar { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; background: var(--color-white); border: 1px solid var(--tracker-line); border-radius: var(--border-radius); padding: var(--space-3); box-shadow: var(--shadow-soft); }
    .project-select-wrap { display: flex; align-items: center; gap: var(--space-2); }
    .field-label { color: var(--tracker-muted); font-size: var(--font-size-xs); font-weight: 700; }
    select, input, textarea { border: 1px solid var(--tracker-line); border-radius: var(--border-radius); color: var(--color-base-darkest); background: var(--color-white); padding: .58rem .7rem; }
    select { min-width: 220px; font-weight: 700; }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-wrap input { width: 100%; padding-left: 2.2rem; }
    .search-icon { position: absolute; top: 50%; left: .75rem; transform: translateY(-50%); color: var(--tracker-muted); }
    .filter-group { display: flex; gap: var(--space-2); align-items: center; }
    .filter-chip { background: var(--color-white); border: 1px solid var(--tracker-line); color: var(--tracker-muted); border-radius: 999px; padding: .45rem .7rem; font-size: var(--font-size-2xs); font-weight: 700; }
    .filter-chip[aria-pressed="true"] { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-primary-lighter); }
    .board-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin: var(--space-5) 0 var(--space-3); color: var(--tracker-muted); font-size: var(--font-size-xs); }
    .board-meta strong { color: var(--color-primary-darker); }
    .board { display: grid; grid-template-columns: repeat(6, minmax(250px, 1fr)); gap: var(--space-3); align-items: start; overflow-x: auto; padding-bottom: var(--space-3); }
    .column { min-height: 430px; background: var(--tracker-column); border: 1px solid var(--tracker-line); border-radius: var(--border-radius); padding: var(--space-3); transition: background .15s ease, outline .15s ease; }
    .column.drag-over { background: var(--color-accent-cool-lighter); outline: 3px dashed var(--color-accent-cool); outline-offset: -3px; }
    .column-header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
    .column-title { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
    .status-ring { width: 17px; height: 17px; border: 2px solid currentColor; border-radius: 50%; flex: none; }
    .status-todo { color: var(--tracker-muted); }
    .status-elaborate { color: var(--tracker-blue); }
    .status-ready { color: var(--tracker-purple); }
    .status-progress { color: var(--color-accent-warm); }
    .status-review { color: var(--tracker-orange); }
    .status-done { color: var(--color-success); }
    .column-title h2 { margin: 0; color: var(--color-base-darkest); font-size: var(--font-size-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .count { background: #dfe5ec; color: var(--tracker-muted); border-radius: 999px; padding: .08rem .42rem; font-size: var(--font-size-2xs); font-weight: 800; }
    .column-actions { display: flex; align-items: center; gap: 2px; }
    .column-actions button { width: 26px; height: 26px; border: 0; border-radius: var(--border-radius); background: transparent; color: var(--tracker-muted); font-weight: 800; font-size: var(--font-size-md); }
    .column-actions button:hover { background: var(--color-white); color: var(--color-primary); }
    .column-description { min-height: 42px; margin: 0 0 var(--space-3); color: var(--tracker-muted); font-size: var(--font-size-2xs); }
    .cards { display: grid; gap: var(--space-3); }
    .work-card { background: var(--tracker-card); border: 1px solid var(--tracker-line); border-radius: var(--border-radius); padding: var(--space-3); box-shadow: 0 1px 2px rgba(22, 46, 81, .05); cursor: grab; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .work-card:hover { transform: translateY(-2px); border-color: var(--color-primary-light); box-shadow: 0 5px 14px rgba(22, 46, 81, .12); }
    .work-card:active { cursor: grabbing; }
    .work-card.dragging { opacity: .45; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
    .item-id { color: var(--color-primary); font-family: var(--font-mono); font-size: var(--font-size-2xs); font-weight: 700; }
    .card-menu { border: 0; background: transparent; color: var(--tracker-muted); font-weight: 900; padding: 0 .2rem; }
    .card-title { margin: 0; color: var(--color-primary-darker); font-size: var(--font-size-sm); line-height: 1.3; }
    .card-description { margin: var(--space-2) 0 0; color: var(--tracker-muted); font-size: var(--font-size-2xs); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: .18rem .48rem; background: var(--color-base-lightest); color: var(--tracker-muted); font-size: var(--font-size-3xs, .81rem); font-weight: 700; }
    .tag-priority { background: var(--color-warning-lighter); color: #805b00; }
    .tag-agent { background: var(--color-accent-cool-lighter); color: var(--color-accent-cool-darker); }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); border-top: 1px solid #e9edf1; margin-top: var(--space-3); padding-top: var(--space-2); color: var(--tracker-muted); font-size: var(--font-size-2xs); }
    .source-link { color: var(--color-primary); text-decoration: none; font-family: var(--font-mono); }
    .source-link:hover { text-decoration: underline; }
    .empty-state { border: 1px dashed var(--tracker-line); border-radius: var(--border-radius); padding: var(--space-5) var(--space-3); text-align: center; color: var(--tracker-muted); font-size: var(--font-size-2xs); }
    .add-card { width: 100%; border: 1px dashed var(--tracker-line); border-radius: var(--border-radius); background: transparent; color: var(--tracker-muted); padding: .65rem; font-weight: 700; }
    .add-card:hover { border-color: var(--color-primary); background: var(--color-white); color: var(--color-primary); }
    .drawer-backdrop, .modal-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(22, 46, 81, .38); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .drawer-backdrop.open, .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; z-index: 31; top: 0; right: 0; width: min(520px, 100%); height: 100vh; background: var(--color-white); box-shadow: -10px 0 30px rgba(22, 46, 81, .16); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-header { padding: var(--space-5); border-bottom: 1px solid var(--tracker-line); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); }
    .drawer-kicker { color: var(--color-primary); font-family: var(--font-mono); font-size: var(--font-size-xs); font-weight: 700; }
    .drawer h2 { margin: var(--space-2) 0 0; color: var(--color-primary-darker); font-size: var(--font-size-lg); line-height: 1.25; }
    .close-button { width: 34px; height: 34px; border: 1px solid var(--tracker-line); border-radius: var(--border-radius); background: var(--color-white); color: var(--tracker-muted); font-size: 1.4rem; line-height: 1; }
    .close-button:hover { color: var(--color-primary); border-color: var(--color-primary); }
    .drawer-body { overflow-y: auto; padding: var(--space-5); display: grid; gap: var(--space-5); }
    .detail-block { display: grid; gap: var(--space-2); }
    .detail-block label { color: var(--tracker-muted); font-size: var(--font-size-xs); font-weight: 800; }
    .detail-block input, .detail-block select, .detail-block textarea { width: 100%; }
    .detail-block textarea { min-height: 120px; resize: vertical; }
    .activity { border-left: 2px solid var(--color-primary-lighter); padding-left: var(--space-4); display: grid; gap: var(--space-3); }
    .activity-entry { position: relative; color: var(--tracker-muted); font-size: var(--font-size-2xs); }
    .activity-entry::before { content: ''; position: absolute; left: -1.35rem; top: .35rem; width: 8px; height: 8px; background: var(--color-accent-cool); border-radius: 50%; }
    .activity-entry strong { color: var(--color-base-darker); }
    .drawer-footer { margin-top: auto; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--tracker-line); display: flex; justify-content: flex-end; gap: var(--space-3); }
    .modal { position: fixed; z-index: 31; top: 50%; left: 50%; width: min(520px, calc(100% - 2rem)); background: var(--color-white); border-radius: var(--border-radius); box-shadow: 0 18px 60px rgba(22, 46, 81, .22); transform: translate(-50%, -46%) scale(.98); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .modal.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
    .modal-header { padding: var(--space-5); border-bottom: 1px solid var(--tracker-line); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { margin: 0; font-size: var(--font-size-lg); color: var(--color-primary-darker); }
    .modal-body { padding: var(--space-5); display: grid; gap: var(--space-4); }
    .modal-footer { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--tracker-line); display: flex; justify-content: flex-end; gap: var(--space-3); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .toast { position: fixed; z-index: 40; bottom: var(--space-5); left: 50%; transform: translate(-50%, 150%); background: var(--color-primary-darker); color: var(--color-white); border-left: 4px solid var(--color-accent-cool); border-radius: var(--border-radius); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-soft); transition: transform .25s ease; font-size: var(--font-size-xs); }
    .toast.show { transform: translate(-50%, 0); }
    @media (max-width: 900px) { .topbar-inner { gap: var(--space-3); } .brand { min-width: 0; } .brand-subtitle { display: none; } .connection { display: none; } .heading-actions { flex-direction: column; align-items: stretch; } }
    @media (max-width: 620px) { .page { padding: var(--space-5) var(--space-3); } .topbar-inner { padding-inline: var(--space-3); } .page-heading { flex-direction: column; } .heading-actions { width: 100%; } .heading-actions .btn { width: 100%; } .workspace-bar { align-items: stretch; } .project-select-wrap, .project-select-wrap select, .search-wrap { width: 100%; } .filter-group { width: 100%; overflow-x: auto; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app-shell" id="tracker-app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" aria-label="Agent Work Item Tracker">
          <div class="brand-mark" aria-hidden="true">A</div>
          <div><div class="brand-name">Agent Work Items</div><div class="brand-subtitle">Personal project control plane</div></div>
        </div>
        <div class="topbar-spacer"></div>
        <div class="connection"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">Live · updated just now</span></div>
        <div class="avatar" title="Signed in as Manny">M</div>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <div class="heading-copy">
          <h1 id="board-title">Agent Workflow Queue</h1>
          <p class="lede">A quiet, dependable work surface for coding agents and personal assistants.</p>
        </div>
        <div class="heading-actions">
          <button class="btn btn-secondary" type="button" id="new-project-button"><span class="icon" aria-hidden="true">＋</span> New project</button>
          <button class="btn btn-primary" type="button" id="new-item-button"><span class="icon" aria-hidden="true">＋</span> New work item</button>
        </div>
      </div>

      <section class="workspace-bar" aria-label="Board controls">
        <div class="project-select-wrap"><span class="field-label">Project</span><label class="sr-only" for="project-select">Choose project</label><select id="project-select"></select></div>
        <div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><label class="sr-only" for="search-input">Search work items</label><input id="search-input" type="search" placeholder="Search title, ID, label, or agent…"></div>
        <div class="filter-group" aria-label="Filters"><button class="filter-chip" type="button" aria-pressed="false" data-filter="mine">Assigned to me</button><button class="filter-chip" type="button" aria-pressed="false" data-filter="priority">Priority only</button></div>
      </section>

      <div class="board-meta"><span><strong id="item-count">0 items</strong> in this project</span><span>Drag cards between columns to update status</span></div>
      <section class="board" id="board" aria-label="Kanban board"></section>
    </main>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="detail-drawer" aria-labelledby="drawer-title" aria-hidden="true">
      <div class="drawer-header"><div><div class="drawer-kicker" id="drawer-id">AWI-000</div><h2 id="drawer-title">Work item</h2></div><button class="close-button" type="button" id="close-drawer" aria-label="Close item details">×</button></div>
      <div class="drawer-body">
        <div class="detail-block"><label for="detail-title">Title</label><input id="detail-title" type="text"></div>
        <div class="detail-block"><label for="detail-description">Description</label><textarea id="detail-description"></textarea></div>
        <div class="form-row"><div class="detail-block"><label for="detail-status">Status</label><select id="detail-status"></select></div><div class="detail-block"><label for="detail-priority">Priority</label><select id="detail-priority"><option value="">None</option><option value="P0">P0 · Critical</option><option value="P1">P1 · High</option><option value="P2">P2 · Normal</option></select></div></div>
        <div class="form-row"><div class="detail-block"><label for="detail-agent">Assignee / agent</label><input id="detail-agent" type="text" placeholder="e.g. Builder"></div><div class="detail-block"><label for="detail-pr">PR URL <span aria-hidden="true">(optional)</span></label><input id="detail-pr" type="url" placeholder="https://github.com/…"></div></div>
        <div class="detail-block"><label>Recent activity</label><div class="activity" id="activity-list"></div></div>
      </div>
      <div class="drawer-footer"><button class="btn btn-secondary" type="button" id="delete-item-button">Delete</button><button class="btn btn-primary" type="button" id="save-item-button">Save changes</button></div>
    </aside>

    <div class="modal-backdrop" id="modal-backdrop"></div>
    <section class="modal" id="new-item-modal" role="dialog" aria-modal="true" aria-labelledby="new-item-title" aria-hidden="true">
      <div class="modal-header"><h2 id="new-item-title">New work item</h2><button class="close-button" type="button" id="close-modal" aria-label="Close new work item dialog">×</button></div>
      <form id="new-item-form">
        <div class="modal-body"><div class="detail-block"><label for="new-title">Title</label><input id="new-title" type="text" required placeholder="What needs to happen?"></div><div class="detail-block"><label for="new-description">Description</label><textarea id="new-description" placeholder="Context for the next agent or future you"></textarea></div><div class="form-row"><div class="detail-block"><label for="new-status">Start in</label><select id="new-status"></select></div><div class="detail-block"><label for="new-priority">Priority</label><select id="new-priority"><option value="">None</option><option value="P0">P0 · Critical</option><option value="P1">P1 · High</option><option value="P2">P2 · Normal</option></select></div></div><div class="detail-block"><label for="new-agent">Assignee / agent <span aria-hidden="true">(optional)</span></label><input id="new-agent" type="text" placeholder="e.g. Implementer"></div></div>
        <div class="modal-footer"><button class="btn btn-secondary" type="button" id="cancel-modal">Cancel</button><button class="btn btn-primary" type="submit">Create item</button></div>
      </form>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (() => {
      const columns = [
        { id: 'todo', title: 'Todo', description: 'Rough ideas and draft intake.', tone: 'status-todo' },
        { id: 'elaborate', title: 'Elaborate', description: 'Issue or epic being shaped.', tone: 'status-elaborate' },
        { id: 'ready', title: 'Ready For Agent', description: 'Clear enough for direct implementation.', tone: 'status-ready' },
        { id: 'progress', title: 'In Progress', description: 'Active coding or assistant work.', tone: 'status-progress' },
        { id: 'review', title: 'Reviewing', description: 'PR open and review or merge pending.', tone: 'status-review' },
        { id: 'done', title: 'Done', description: 'PR merged or work item closed.', tone: 'status-done' }
      ];
      const projects = {
        'agent-factory': {
          name: 'Agent Factory',
          items: [
            { number: 134, title: 'Add ready-for-agent transition guard', description: 'Require acceptance criteria before a card can move into the implementation queue.', status: 'todo', priority: 'P1', agent: 'Manny', labels: ['workflow', 'policy'], source: 'factory#134', activity: ['Manny created this item', 'Acceptance criteria requested'] },
            { number: 148, title: 'Document API token rotation', description: 'Write the short runbook for creating, rotating, and revoking headless agent tokens.', status: 'elaborate', priority: 'P2', agent: 'Penny', labels: ['docs'], source: 'factory#148', activity: ['Penny started shaping this item'] },
            { number: 152, title: 'Persist agent claim metadata', description: 'Store which agent claimed a work item and when the claim occurred.', status: 'ready', priority: 'P1', agent: 'Builder', labels: ['api', 'persistence'], source: 'factory#152', activity: ['Builder marked this ready'] },
            { number: 157, title: 'Implement project board endpoint', description: 'Expose the first REST read path for rendering a project board.', status: 'progress', priority: 'P0', agent: 'Implementer', labels: ['api'], source: 'factory#157', activity: ['Implementer claimed this item', 'API route scaffolded'] },
            { number: 104, title: 'Review Cognito access flow', description: 'Check the owner login and personal token assumptions against the deployment shape.', status: 'review', priority: 'P1', agent: 'Reviewer', labels: ['security'], source: 'factory#104', activity: ['Reviewer opened a review note', 'Manny linked the deployment plan'] },
            { number: 158, title: 'Ship the first board prototype', description: 'Verify the board feels useful before adding persistence and deployment plumbing.', status: 'done', priority: 'P0', agent: 'Manny', labels: ['prototype'], source: 'factory#158', activity: ['Manny completed this item', 'Prototype approved'] }
          ]
        },
        'personal-ops': {
          name: 'Personal Ops',
          items: [
            { number: 21, title: 'Refresh home lab inventory', description: 'Capture the current machines, services, and backup status.', status: 'todo', priority: 'P2', agent: 'Manny', labels: ['home'], source: '', activity: ['Manny created this item'] },
            { number: 22, title: 'Plan weekly newsletter inputs', description: 'Decide which second-brain sources deserve a recurring review.', status: 'ready', priority: 'P1', agent: 'Penny', labels: ['writing'], source: '', activity: ['Penny marked this ready'] },
            { number: 23, title: 'Consolidate shell aliases', description: 'Remove stale aliases and capture the useful ones in dotfiles.', status: 'progress', priority: 'P1', agent: 'Builder', labels: ['dotfiles'], source: '', activity: ['Builder started work'] }
          ]
        }
      };

      let activeProject = 'agent-factory';
      let selectedNumber = null;
      let dragNumber = null;
      const filters = { mine: false, priority: false };
      const $ = (id) => document.getElementById(id);
      const project = () => projects[activeProject];
      const itemByNumber = (number) => project().items.find((item) => item.number === number);

      function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }
      function visibleItems() {
        const query = $('search-input').value.trim().toLowerCase();
        return project().items.filter((item) => {
          const haystack = [item.title, item.description, item.number, item.agent, item.source, ...(item.labels || [])].join(' ').toLowerCase();
          return (!query || haystack.includes(query)) && (!filters.mine || item.agent === 'Manny') && (!filters.priority || Boolean(item.priority));
        });
      }
      function populateSelects() {
        $('project-select').innerHTML = Object.entries(projects).map(([id, value]) => `<option value="${id}" ${id === activeProject ? 'selected' : ''}>${escapeHtml(value.name)}</option>`).join('');
        const statusOptions = columns.map((column) => `<option value="${column.id}">${escapeHtml(column.title)}</option>`).join('');
        $('detail-status').innerHTML = statusOptions;
        $('new-status').innerHTML = statusOptions;
      }
      function cardMarkup(item) {
        const tags = [item.priority ? `<span class="tag tag-priority">${escapeHtml(item.priority)}</span>` : '', ...(item.labels || []).slice(0, 2).map((label) => `<span class="tag">${escapeHtml(label)}</span>`), item.agent ? `<span class="tag tag-agent">${escapeHtml(item.agent)}</span>` : ''].filter(Boolean).join('');
        return `<article class="work-card" draggable="true" data-number="${item.number}" tabindex="0" aria-label="${escapeHtml(item.title)}, item ${item.number}"><div class="card-top"><span class="item-id">#${item.number}</span><button class="card-menu" type="button" data-open-item="${item.number}" aria-label="Open ${escapeHtml(item.title)}">···</button></div><h3 class="card-title">${escapeHtml(item.title)}</h3><p class="card-description">${escapeHtml(item.description)}</p><div class="card-tags">${tags}</div><div class="card-footer"><span>${item.source ? `<a class="source-link" href="#" data-source-link="${item.number}" title="Optional external reference">${escapeHtml(item.source)}</a>` : 'Personal work'}</span><span>${item.activity?.length || 0} updates</span></div></article>`;
      }
      function renderBoard() {
        const items = visibleItems();
        $('board-title').textContent = project().name;
        $('item-count').textContent = `${items.length} ${items.length === 1 ? 'item' : 'items'}`;
        $('board').innerHTML = columns.map((column) => {
          const columnItems = items.filter((item) => item.status === column.id);
          const cards = columnItems.length ? columnItems.map(cardMarkup).join('') : '<div class="empty-state">Drop work here</div>';
          return `<section class="column" data-status="${column.id}" aria-label="${escapeHtml(column.title)} column"><div class="column-header"><div class="column-title ${column.tone}"><span class="status-ring" aria-hidden="true"></span><h2>${escapeHtml(column.title)}</h2><span class="count">${columnItems.length}</span></div><div class="column-actions"><button type="button" aria-label="More actions for ${escapeHtml(column.title)}">···</button><button type="button" data-add-status="${column.id}" aria-label="Add item to ${escapeHtml(column.title)}">＋</button></div></div><p class="column-description">${escapeHtml(column.description)}</p><div class="cards">${cards}</div><button type="button" class="add-card" data-add-status="${column.id}">＋ Add work item</button></section>`;
        }).join('');
        document.querySelectorAll('.work-card').forEach((card) => {
          card.addEventListener('dragstart', () => { dragNumber = Number(card.dataset.number); card.classList.add('dragging'); });
          card.addEventListener('dragend', () => { dragNumber = null; card.classList.remove('dragging'); });
          card.addEventListener('click', (event) => { if (!event.target.closest('button, a')) openDrawer(Number(card.dataset.number)); });
          card.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDrawer(Number(card.dataset.number)); } });
        });
        document.querySelectorAll('.column').forEach((column) => {
          column.addEventListener('dragover', (event) => { event.preventDefault(); column.classList.add('drag-over'); });
          column.addEventListener('dragleave', () => column.classList.remove('drag-over'));
          column.addEventListener('drop', (event) => { event.preventDefault(); column.classList.remove('drag-over'); if (dragNumber !== null) moveItem(dragNumber, column.dataset.status); });
        });
        document.querySelectorAll('[data-open-item]').forEach((button) => button.addEventListener('click', () => openDrawer(Number(button.dataset.openItem))));
        document.querySelectorAll('[data-add-status]').forEach((button) => button.addEventListener('click', () => openNewModal(button.dataset.addStatus)));
        document.querySelectorAll('[data-source-link]').forEach((link) => link.addEventListener('click', (event) => { event.preventDefault(); showToast('External references are optional links in v1.'); }));
      }
      function showToast(message) { const toast = $('toast'); toast.textContent = message; toast.classList.add('show'); window.clearTimeout(showToast.timer); showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2600); }
      function moveItem(number, status) { const item = itemByNumber(number); if (!item || item.status === status) return; const old = columns.find((column) => column.id === item.status)?.title; const next = columns.find((column) => column.id === status)?.title; item.status = status; item.activity = [`Moved from ${old} to ${next}`, ...(item.activity || [])]; renderBoard(); showToast(`#${item.number} moved to ${next}`); touchLive(); }
      function openDrawer(number) { const item = itemByNumber(number); if (!item) return; selectedNumber = number; $('drawer-id').textContent = `AWI-${String(number).padStart(3, '0')}`; $('drawer-title').textContent = item.title; $('detail-title').value = item.title; $('detail-description').value = item.description; $('detail-status').value = item.status; $('detail-priority').value = item.priority || ''; $('detail-agent').value = item.agent || ''; $('detail-pr').value = item.pr || ''; $('activity-list').innerHTML = (item.activity || []).slice(0, 5).map((entry, index) => `<div class="activity-entry"><strong>${index === 0 ? 'Latest' : 'Earlier'}</strong> · ${escapeHtml(entry)}</div>`).join(''); $('detail-drawer').classList.add('open'); $('drawer-backdrop').classList.add('open'); $('detail-drawer').setAttribute('aria-hidden', 'false'); $('detail-title').focus(); }
      function closeDrawer() { $('detail-drawer').classList.remove('open'); $('drawer-backdrop').classList.remove('open'); $('detail-drawer').setAttribute('aria-hidden', 'true'); selectedNumber = null; }
      function saveDrawer() { const item = itemByNumber(selectedNumber); if (!item) return; const oldStatus = item.status; item.title = $('detail-title').value.trim() || item.title; item.description = $('detail-description').value.trim(); item.status = $('detail-status').value; item.priority = $('detail-priority').value; item.agent = $('detail-agent').value.trim(); item.pr = $('detail-pr').value.trim(); item.activity = ['Details updated by Manny', ...(item.activity || [])]; closeDrawer(); renderBoard(); showToast(`#${item.number} saved`); if (oldStatus !== item.status) showToast(`#${item.number} moved to ${columns.find((c) => c.id === item.status).title}`); touchLive(); }
      function deleteSelected() { const item = itemByNumber(selectedNumber); if (!item) return; if (!window.confirm(`Delete #${item.number} — ${item.title}?`)) return; project().items = project().items.filter((candidate) => candidate.number !== item.number); closeDrawer(); renderBoard(); showToast(`#${item.number} deleted`); touchLive(); }
      function openNewModal(status = 'todo') { $('new-item-form').reset(); $('new-status').value = status; $('new-item-modal').classList.add('open'); $('modal-backdrop').classList.add('open'); $('new-item-modal').setAttribute('aria-hidden', 'false'); $('new-title').focus(); }
      function closeModal() { $('new-item-modal').classList.remove('open'); $('modal-backdrop').classList.remove('open'); $('new-item-modal').setAttribute('aria-hidden', 'true'); }
      function addItem(event) { event.preventDefault(); const title = $('new-title').value.trim(); if (!title) return; const highest = project().items.reduce((max, item) => Math.max(max, item.number), 0); const item = { number: highest + 1, title, description: $('new-description').value.trim(), status: $('new-status').value, priority: $('new-priority').value, agent: $('new-agent').value.trim(), labels: [], source: '', activity: ['Manny created this item'] }; project().items.push(item); closeModal(); renderBoard(); showToast(`#${item.number} created`); touchLive(); }
      function touchLive() { $('connection-label').textContent = 'Live · updated just now'; }
      $('project-select').addEventListener('change', (event) => { activeProject = event.target.value; renderBoard(); touchLive(); });
      $('search-input').addEventListener('input', renderBoard);
      document.querySelectorAll('[data-filter]').forEach((button) => button.addEventListener('click', () => { const filter = button.dataset.filter; filters[filter] = !filters[filter]; button.setAttribute('aria-pressed', String(filters[filter])); renderBoard(); }));
      $('new-item-button').addEventListener('click', () => openNewModal());
      $('new-project-button').addEventListener('click', () => showToast('Project creation will be a REST-backed action in v1.'));
      $('close-drawer').addEventListener('click', closeDrawer); $('drawer-backdrop').addEventListener('click', closeDrawer); $('save-item-button').addEventListener('click', saveDrawer); $('delete-item-button').addEventListener('click', deleteSelected);
      $('close-modal').addEventListener('click', closeModal); $('cancel-modal').addEventListener('click', closeModal); $('modal-backdrop').addEventListener('click', closeModal); $('new-item-form').addEventListener('submit', addItem);
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { closeDrawer(); closeModal(); } });
      window.setInterval(() => { const label = $('connection-label'); label.textContent = 'Live · checking…'; window.setTimeout(() => { label.textContent = 'Live · updated just now'; }, 500); }, 5000);
      populateSelects(); renderBoard();
    })();
  </script>
</body>
</html>
